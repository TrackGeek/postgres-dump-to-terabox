services:
  backup:
    build:
      context: .
      args:
        POSTGRES_MAJOR: 18
    image: trackgeek-backup
    container_name: trackgeek-backup
    restart: unless-stopped
    env_file: .env
    environment:
      TMP_DIR: /app/tmp
      TERABOX_STORAGE_STATE: /app/secrets/storageState.json
    volumes:
      - ./secrets:/app/secrets:ro
      - backup-tmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The host resolver is not reachable from the container on every setup (a VPN on
    # the host is enough to break it), and Terabox is the first thing that needs DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  backup-tmp:
